[project]
name = "caspian"
version = "0.1.0"
description = "Hebrew harmonic analysis tool for Israeli song chord progressions"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.24.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "pyjwt[crypto]>=2.11.0",
    "bcrypt>=5.0.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.39", "openai>=1.50"]

[project.scripts]
caspian = "caspian.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caspian"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
src = ["src"]
line-length = 100

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]
