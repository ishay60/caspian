# fly.toml app configuration file generated for caspian on 2026-02-23T12:04:06+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'caspian'
primary_region = 'fra'

[build]

[env]
  ALLOWED_ORIGINS = 'https://caspian.fly.dev'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
  memory_mb = 256
